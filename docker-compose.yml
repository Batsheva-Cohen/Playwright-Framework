services:
  app1:
    build: .
    environment:
      INSTANCE_ID: app1
      TASKBOARD_DB: /data/tasks.db
      JWT_SECRET: shared-secret-across-instances-change-me-in-prod
      FERNET_KEY: -8UT8zApukRqSldTedZZlFN6J1SpCkuyYobXz_qwvtM=
    volumes:
      - shared-data:/data

  app2:
    build: .
    environment:
      INSTANCE_ID: app2
      TASKBOARD_DB: /data/tasks.db
      JWT_SECRET: shared-secret-across-instances-change-me-in-prod
      FERNET_KEY: -8UT8zApukRqSldTedZZlFN6J1SpCkuyYobXz_qwvtM=
    volumes:
      - shared-data:/data

  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2

volumes:
  shared-data: